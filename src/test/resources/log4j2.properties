status = error

name = PropertiesConfig


# =========================================================
# CONSOLE APPENDER
# =========================================================

appender.console.type = Console
appender.console.name = Console

appender.console.layout.type = PatternLayout

appender.console.layout.pattern = %d{HH:mm:ss} %-5level %logger{36} - %msg%n


# =========================================================
# TESTNG LOGGING
# =========================================================

logger.testng.name = org.testng
logger.testng.level = WARN
logger.testng.additivity = false
logger.testng.appenderRefs = console
logger.testng.appenderRef.console.ref = Console


# =========================================================
# APPLICATION / FRAMEWORK LOGGING
# =========================================================

rootLogger.level = INFO

rootLogger.appenderRefs = console

rootLogger.appenderRef.console.ref = Console